<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroScale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FF7A1A'/%3E%3Cpath d='M26 19.5v-2l-8-5V7.5a2 2 0 0 0-4 0v5l-8 5v2l8-2.5v5l-2.2 1.6V25l4.2-1.2 4.2 1.2v-1.4L18 22v-5z' fill='%231A0E04'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="app">
  <aside class="rail" id="rail">
    <a class="brand" href="#/painel" aria-label="AeroScale – painel">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-word">Aero<b>Scale</b></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menu-btn" aria-label="Abrir menu"></button>
      <div class="search" id="search">
        <span class="search-ico" aria-hidden="true"></span>
        <input id="search-input" type="search" placeholder="Buscar voo, matrícula, escala ou aeroporto" autocomplete="off" aria-label="Busca global">
        <kbd>Ctrl K</kbd>
        <div class="search-results" id="search-results" role="listbox" hidden></div>
      </div>
      <div class="clocks" aria-live="off">
        <div><span class="clock-val" id="clock-utc">--:--</span><span class="clock-lbl">UTC</span></div>
        <div><span class="clock-val" id="clock-local">--:--</span><span class="clock-lbl">Brasília</span></div>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
